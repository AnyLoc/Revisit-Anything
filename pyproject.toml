[project]
name = "revisit-anything"
version = "0.1.0"
description = "SegVLAD / Revisit Anything: visual place recognition via segment retrieval"
requires-python = "==3.10.12"
dependencies = [
    "torch",
    "torchvision",
    "h5py",
    "loguru",
    "tqdm",
    "scikit-learn>=1.5.0",
    "numpy<2",
    "scipy>=1.14.0",
    "matplotlib",
    "opencv-python",
    "transformers",
    "einops",
    "fast-pytorch-kmeans",
    "hydra-core",
    "omegaconf",
    "natsort",
    "faiss-cpu",
    "pytorch-lightning",
    "pytorch-metric-learning",
    "torchmetrics",
    "ultralytics==8.0.120",
    "huggingface-hub",
    "tyro",
    "utm",
    "py-cpuinfo",
    "prettytable",
    "pynvml",
    "pyyaml",
    "kornia",
    "python-dotenv",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["revisit_anything*", "fastsam*"]
where=[".", "submodules/FastSAM"]
